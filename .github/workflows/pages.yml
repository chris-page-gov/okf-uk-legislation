name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  core:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: core
      lockstep_base: HEAD^

  legislation:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: legislation

  semantics:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: semantics

  federation:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: federation

  validate:
    if: ${{ always() }}
    needs: [core, legislation, semantics, federation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation phase
        env:
          CORE_RESULT: ${{ needs.core.result }}
          LEGISLATION_RESULT: ${{ needs.legislation.result }}
          SEMANTICS_RESULT: ${{ needs.semantics.result }}
          FEDERATION_RESULT: ${{ needs.federation.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$LEGISLATION_RESULT" = success
          test "$SEMANTICS_RESULT" = success
          test "$FEDERATION_RESULT" = success

  deploy:
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the validated publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: bundle
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
