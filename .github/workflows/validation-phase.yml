name: Reusable OKF validation phase

on:
  workflow_call:
    inputs:
      phase:
        description: Bounded validation phase to execute
        required: true
        type: string
      lockstep_base:
        description: Optional Git base for documentation lockstep
        required: false
        default: ""
        type: string
      publish_reader:
        description: Retain the verified Reader candidate for the Pages deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Set up the governed locked Python environment
        uses: ./.github/actions/setup-locked-python
      - name: Check documentation lockstep
        if: ${{ inputs.lockstep_base != '' }}
        env:
          LOCKSTEP_BASE: ${{ inputs.lockstep_base }}
        run: |
          uv run --locked python scripts/check_documentation_lockstep.py --base "$LOCKSTEP_BASE"
      - name: Run the bounded offline validation phase
        env:
          OKF_VALIDATION_PHASE: ${{ inputs.phase }}
          OKF_VALIDATION_TIMINGS: ${{ runner.temp }}/okf-validation-timings.tsv
          RETAIN_READER_CANDIDATE: ${{ inputs.publish_reader }}
        run: |
          if [ "$RETAIN_READER_CANDIDATE" = "true" ]; then
            test "$OKF_VALIDATION_PHASE" = legislation
            export OKF_VALIDATED_READER_OUTPUT="$RUNNER_TEMP/legislation-reader"
          fi
          uv run --locked sh scripts/validate_publication.sh
      - name: Upload the verified Reader candidate
        if: inputs.publish_reader
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/legislation-reader
