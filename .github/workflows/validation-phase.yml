name: Reusable OKF validation phase

on:
  workflow_call:
    inputs:
      phase:
        description: Bounded validation phase to execute
        required: true
        type: string
      lockstep_base:
        description: Optional Git base for documentation lockstep
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validation dependencies
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements-validation.txt
      - name: Check documentation lockstep
        if: ${{ inputs.lockstep_base != '' }}
        env:
          LOCKSTEP_BASE: ${{ inputs.lockstep_base }}
        run: |
          python3 scripts/check_documentation_lockstep.py --base "$LOCKSTEP_BASE"
      - name: Run the bounded offline validation phase
        env:
          OKF_VALIDATION_PHASE: ${{ inputs.phase }}
          OKF_VALIDATION_TIMINGS: ${{ runner.temp }}/okf-validation-timings.tsv
        run: sh scripts/validate_publication.sh
