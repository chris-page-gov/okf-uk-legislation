name: OKF bundle CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okf-bundle-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validation dependencies
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements-validation.txt
      - name: Check publication contract and documentation lockstep
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 scripts/check_publication_contract.py
          python3 scripts/check_documentation_lockstep.py --base HEAD^1
      - name: Run complete offline publication validation
        env:
          OKF_VALIDATION_TIMINGS: ${{ runner.temp }}/okf-validation-timings.tsv
        run: sh scripts/validate_publication.sh
