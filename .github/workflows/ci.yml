name: OKF bundle CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okf-bundle-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: core
      lockstep_base: HEAD^1

  legislation:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: legislation

  semantics:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: semantics

  federation:
    uses: ./.github/workflows/validation-phase.yml
    with:
      phase: federation

  validate:
    if: ${{ always() }}
    needs: [core, legislation, semantics, federation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation phase
        env:
          CORE_RESULT: ${{ needs.core.result }}
          LEGISLATION_RESULT: ${{ needs.legislation.result }}
          SEMANTICS_RESULT: ${{ needs.semantics.result }}
          FEDERATION_RESULT: ${{ needs.federation.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$LEGISLATION_RESULT" = success
          test "$SEMANTICS_RESULT" = success
          test "$FEDERATION_RESULT" = success
