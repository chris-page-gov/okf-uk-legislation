name: Whole-Law integrity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validation dependencies
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements-validation.txt
      - name: Recompute only the Whole-Law projection
        env:
          EXPECTED_ROOT: ${{ runner.temp }}/whole-law-expected
          DIFF_PATH: ${{ runner.temp }}/whole-law-integrity-diff.txt
        run: |
          python3 scripts/build_whole_law_okf.py --output "$EXPECTED_ROOT"
          python3 - <<'PY'
          import difflib
          import os
          from pathlib import Path

          actual = Path("bundle/whole-law/integrity.json")
          expected = Path(os.environ["EXPECTED_ROOT"]) / "integrity.json"
          diff = "\n".join(
              difflib.unified_diff(
                  actual.read_text(encoding="utf-8").splitlines(),
                  expected.read_text(encoding="utf-8").splitlines(),
                  fromfile="committed/integrity.json",
                  tofile="linux-expected/integrity.json",
                  lineterm="",
              )
          )
          Path(os.environ["DIFF_PATH"]).write_text(diff + "\n", encoding="utf-8")
          print(diff or "integrity files are byte-identical")
          PY
          shasum -a 256 bundle/whole-law/integrity.json "$EXPECTED_ROOT/integrity.json"
      - name: Upload the bounded diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whole-law-integrity-diagnostic
          path: |
            ${{ runner.temp }}/whole-law-expected/integrity.json
            ${{ runner.temp }}/whole-law-integrity-diff.txt
          if-no-files-found: error
          retention-days: 1
