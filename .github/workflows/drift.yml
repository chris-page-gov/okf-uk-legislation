name: Read-only publication drift probe

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-drift
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the published branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-validation.txt
      - name: Observe source, access, link, checksum and new-work drift
        run: python3 scripts/check_release_drift.py --output "$RUNNER_TEMP/okf-drift-report.json"
      - name: Retain the immutable observation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: okf-drift-${{ github.run_id }}
          path: ${{ runner.temp }}/okf-drift-report.json
          if-no-files-found: error
          retention-days: 90
