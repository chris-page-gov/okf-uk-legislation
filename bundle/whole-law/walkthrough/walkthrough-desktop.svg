<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title description"><title id="title">Separate ingestion from source discovery</title><desc id="description">The second link describes a register entry, not a second ingested corpus.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#315574"/></marker></defs><rect width="1200" height="570" fill="#f4f7fb"/><rect x="25" y="100" width="360" height="190" rx="12" fill="white" stroke="#315574"/><text x="41" y="134" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Whole-Law federation</text><text x="41" y="159" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">72 researched sources; 36</text><text x="41" y="184" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">classes</text><rect x="420" y="100" width="360" height="190" rx="12" fill="white" stroke="#315574"/><text x="436" y="134" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Legislation</text><text x="436" y="159" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">One implemented child</text><text x="436" y="184" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">365,786 work records</text><rect x="815" y="100" width="360" height="190" rx="12" fill="white" stroke="#315574"/><text x="831" y="134" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Find Case Law: SRC009 / SRC010</text><text x="831" y="159" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Catalogued source and licence</text><text x="831" y="184" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">boundary</text><text x="831" y="209" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">No ingested judgments child</text><path data-connector="true" d="M 388 195.0 L 412 195.0" fill="none" stroke="#315574" stroke-width="2" marker-end="url(#arrow)"/><text x="388" y="325" fill="#142d4d" font-family="Arial,sans-serif" font-size="14">implemented child</text><path data-connector="true" d="M 205 295 L 205 380 L 995 380 L 995 295" fill="none" stroke="#315574" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="414" fill="#142d4d" font-family="Arial,sans-serif" font-size="14">catalogued source</text><text x="28" y="505" fill="#142d4d" font-family="Arial,sans-serif" font-size="15">The second link describes a register entry, not a second ingested corpus.</text></svg>
