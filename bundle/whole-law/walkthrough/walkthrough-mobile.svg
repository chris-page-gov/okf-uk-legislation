<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 990" role="img" aria-labelledby="title description"><title id="title">Separate ingestion from source discovery</title><desc id="description">The second link describes a register entry, not a second ingested corpus.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#315574"/></marker></defs><rect width="360" height="990" fill="#f4f7fb"/><rect x="28" y="80" width="304" height="180" rx="12" fill="white" stroke="#315574"/><text x="44" y="114" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Whole-Law federation</text><text x="44" y="139" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">72 researched sources; 36</text><text x="44" y="164" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">classes</text><rect x="28" y="340" width="304" height="180" rx="12" fill="white" stroke="#315574"/><text x="44" y="374" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Legislation</text><text x="44" y="399" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">One implemented child</text><text x="44" y="424" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">365,786 work records</text><rect x="28" y="600" width="304" height="180" rx="12" fill="white" stroke="#315574"/><text x="44" y="634" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Find Case Law: SRC009 /</text><text x="44" y="659" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">SRC010</text><text x="44" y="684" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Catalogued source and</text><text x="44" y="709" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">licence boundary</text><text x="44" y="734" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">No ingested judgments</text><text x="44" y="759" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">child</text><path data-connector="true" d="M 180.0 263 L 180.0 332" fill="none" stroke="#315574" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="300" fill="#142d4d" font-family="Arial,sans-serif" font-size="14">implemented child</text><path data-connector="true" d="M 28 170 L 12 170 L 12 690 L 24 690" fill="none" stroke="#315574" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="575" fill="#142d4d" font-family="Arial,sans-serif" font-size="14">catalogued source</text><text x="28" y="925" fill="#142d4d" font-family="Arial,sans-serif" font-size="15">The second link describes a register</text><text x="28" y="946" fill="#142d4d" font-family="Arial,sans-serif" font-size="15">entry, not a second ingested corpus.</text></svg>
