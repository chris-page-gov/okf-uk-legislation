<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 990" role="img" aria-labelledby="title description"><title id="title">Trace a recorded effect</title><desc id="description">Direction and provision references come from the frozen effect row.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#315574"/></marker></defs><rect width="360" height="990" fill="#f4f7fb"/><rect x="28" y="80" width="304" height="180" rx="12" fill="white" stroke="#315574"/><text x="44" y="114" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Commencement Order</text><text x="44" y="139" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">2010/2317</text><text x="44" y="164" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Source work</text><rect x="28" y="340" width="304" height="180" rx="12" fill="white" stroke="#315574"/><text x="44" y="374" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Recorded coming-into-force</text><text x="44" y="399" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">effect</text><text x="44" y="424" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Applied in July snapshot</text><text x="44" y="449" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Review overdue since 25</text><text x="44" y="474" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">August 2026</text><rect x="28" y="600" width="304" height="180" rx="12" fill="white" stroke="#315574"/><text x="44" y="634" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Equality Act 2010</text><text x="44" y="659" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Target work</text><text x="44" y="684" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">Supplied refs: Schedule</text><text x="44" y="709" fill="#142d4d" font-family="Arial,sans-serif" font-size="17">26, paragraph 30</text><path data-connector="true" d="M 180.0 263 L 180.0 332" fill="none" stroke="#315574" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="300" fill="#142d4d" font-family="Arial,sans-serif" font-size="14">source</text><path data-connector="true" d="M 180.0 523 L 180.0 592" fill="none" stroke="#315574" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="560" fill="#142d4d" font-family="Arial,sans-serif" font-size="14">target</text><text x="28" y="925" fill="#142d4d" font-family="Arial,sans-serif" font-size="15">Direction and provision references</text><text x="28" y="946" fill="#142d4d" font-family="Arial,sans-serif" font-size="15">come from the frozen effect row.</text></svg>
